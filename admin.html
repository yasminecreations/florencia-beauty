<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Nova+Round&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fffff0;
            font-family: "Nova Round", sans-serif;
        }

        .admin-login {
            width: 90%;
            max-width: 400px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .admin-login h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-login label {
            display: block;
            margin-bottom: 8px;
        }

        .admin-login input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        .admin-login button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #f3d6dc;
            cursor: pointer;
            font-family: inherit;
            font-size: 16px;
        }

        .admin-login button:hover {
            opacity: 0.85;
        }

        #login-message {
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <div class="admin-login">

        <h1>Admin Login</h1>

        <label for="adminEmail">
            Email
        </label>

        <input
            type="email"
            id="adminEmail"
            placeholder="Enter your email"
        >

        <label for="adminPassword">
            Password
        </label>

        <input
            type="password"
            id="adminPassword"
            placeholder="Enter your password"
        >

        <button id="loginButton">
            Login
        </button>

        <p id="login-message"></p>

    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://wcnjkjpqgwpszesjiuzz.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_w5h0bJZLiL_LGc5V09P6JA_PZwfnpLD";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );


        const loginButton =
            document.getElementById(
                "loginButton"
            );

        const loginMessage =
            document.getElementById(
                "login-message"
            );


        loginButton.addEventListener(
            "click",
            async () => {

                const email =
                    document.getElementById(
                        "adminEmail"
                    ).value.trim();

                const password =
                    document.getElementById(
                        "adminPassword"
                    ).value;


                if (!email || !password) {

                    loginMessage.textContent =
                        "Please enter your email and password.";

                    return;
                }


                loginMessage.textContent =
                    "Logging in...";


                const { data, error } =
                    await supabaseClient.auth.signInWithPassword({

                        email: email,

                        password: password

                    });


                if (error) {

                    console.error(
                        "Login error:",
                        error
                    );

                    loginMessage.textContent =
                        "Invalid email or password.";

                    return;
                }


                console.log(
                    "Admin logged in:",
                    data.user
                );


                window.location.href =+
                    "admin-dashboard.html";

            }
        );

    </script>

</body>

</html>
